<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Black rounded background -->
  <rect width="32" height="32" rx="7" fill="#111"/>
  <!-- Orange pixel EKG / heartbeat line -->
  <!-- baseline left -->
  <rect x="1"  y="17" width="4" height="2" fill="#f97316"/>
  <rect x="5"  y="17" width="2" height="2" fill="#f97316"/>
  <!-- first small blip up -->
  <rect x="7"  y="15" width="2" height="2" fill="#f97316"/>
  <rect x="9"  y="17" width="2" height="2" fill="#f97316"/>
  <!-- baseline mid-left -->
  <rect x="11" y="17" width="2" height="2" fill="#f97316"/>
  <!-- sharp spike up -->
  <rect x="13" y="13" width="2" height="2" fill="#f97316"/>
  <rect x="13" y="11" width="2" height="2" fill="#f97316"/>
  <rect x="13" y="9"  width="2" height="2" fill="#f97316"/>
  <rect x="13" y="7"  width="2" height="2" fill="#f97316"/>
  <!-- spike tip -->
  <rect x="15" y="5"  width="2" height="2" fill="#f97316"/>
  <!-- spike down -->
  <rect x="17" y="7"  width="2" height="2" fill="#f97316"/>
  <rect x="17" y="9"  width="2" height="2" fill="#f97316"/>
  <rect x="17" y="11" width="2" height="2" fill="#f97316"/>
  <rect x="17" y="13" width="2" height="2" fill="#f97316"/>
  <!-- dip below baseline -->
  <rect x="17" y="17" width="2" height="2" fill="#f97316"/>
  <rect x="17" y="19" width="2" height="2" fill="#f97316"/>
  <rect x="17" y="21" width="2" height="2" fill="#f97316"/>
  <!-- back to baseline -->
  <rect x="19" y="17" width="2" height="2" fill="#f97316"/>
  <!-- second small blip -->
  <rect x="21" y="15" width="2" height="2" fill="#f97316"/>
  <rect x="23" y="17" width="2" height="2" fill="#f97316"/>
  <!-- baseline right -->
  <rect x="25" y="17" width="2" height="2" fill="#f97316"/>
  <rect x="27" y="17" width="4" height="2" fill="#f97316"/>
</svg>
