# Pulls the published image. Works with no .env at all — every value below
# has a default. Copy .env.example to .env to change any of them without
# editing this file.
#
# Development builds from source instead:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# The :z on the bind mount is an SELinux label. Docker on this host has label
# confinement disabled so it changes nothing there, but Podman enables it by
# default and would otherwise deny the container access to the data directory.
# Harmless everywhere else, so it is set unconditionally.

services:
  workout-tracker:
    image: ghcr.io/n0ne117/workout-tracker:${WORKOUTS_IMAGE_TAG:-latest}
    container_name: workout-tracker
    restart: unless-stopped
    ports:
      - "${WORKOUTS_PORT:-7733}:80"
    volumes:
      # Holds workouts.db. Back this up; everything else is disposable.
      - ${WORKOUTS_DATA_HOST:-./workout_data}:/data:z
    environment:
      TZ: ${TZ:-UTC}
      # Blank means run as root, which is what a plain `docker compose up`
      # should do. Set them to drop the API to a specific user (Unraid: 99/100).
      PUID: ${PUID:-}
      PGID: ${PGID:-}
