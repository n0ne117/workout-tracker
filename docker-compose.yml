services:
  workout-tracker:
    image: ghcr.io/n0ne117/workout-tracker:latest
    container_name: workout-tracker
    restart: unless-stopped
    ports:
      - "7733:80"
    volumes:
      # Holds workouts.db. Back this up; everything else is disposable.
      - ./workout_data:/data
    environment:
      - TZ=Europe/Vienna
      # Uncomment to run the API as a non-root user (Unraid: 99 / 100).
      # - PUID=99
      # - PGID=100
