services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./workout_data:/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "7733:80"
    depends_on:
      backend:
        condition: service_healthy

