# nginx config for the all-in-one image: serves the built SPA and proxies the
# API to uvicorn on loopback. The two-container compose setup uses
# frontend/nginx.conf instead, which proxies to the `backend` service by name.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /app/static;
    index index.html;

    # FIT/GPX/TCX/KML uploads are routinely several MB.
    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Intervals.icu imports and large file parses can take a while.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }

    # Hashed asset filenames are immutable, so let clients keep them.
    location /assets/ {
        access_log off;
        # One header only — `expires` would emit a second Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or a new release stays invisible
    # behind a stale shell pointing at deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — client-side routes like /stats are not real files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
